<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Rounded Cyber Background -->
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#cyberGrad)" stroke-width="2" opacity="0.6"/>
  <!-- Glowing Target Circle -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="url(#cyberGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Glowing Checkmark -->
  <path d="M23 32.5l6.5 6.5 12-13" fill="none" stroke="#00ffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
